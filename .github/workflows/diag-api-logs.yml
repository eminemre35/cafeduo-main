name: Diag VPS API Logs

# Manual diagnostic workflow — tails the API container's stdout on demand.
# Triggered from the Actions tab via "Run workflow"; output lands in the
# job summary so it's readable without VPS shell access. Use this when a
# user reports a 500 we can't reproduce locally and we need the stack
# trace from production.

on:
  workflow_dispatch:
    inputs:
      lines:
        description: Number of log lines to pull (default 200)
        required: false
        default: '200'
      grep:
        description: Optional grep pattern to filter the tail (e.g. "wheel", "ERROR")
        required: false
        default: ''

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required secret: $var" >&2
              exit 1
            fi
          done

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull API container logs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          LINES: ${{ inputs.lines }}
          GREP_PATTERN: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' LINES='${LINES}' GREP_PATTERN='${GREP_PATTERN}' bash -s" <<'REMOTE' > raw-logs.txt
            set -euo pipefail
            cd "$DEPLOY_PATH"
            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose "$@"; }
            else
              compose() { docker-compose "$@"; }
            fi
            if [ -n "${GREP_PATTERN}" ]; then
              compose -f deploy/docker-compose.prod.yml --env-file .env logs api --tail "${LINES}" 2>&1 \
                | grep -iE "${GREP_PATTERN}" || true
            else
              compose -f deploy/docker-compose.prod.yml --env-file .env logs api --tail "${LINES}" 2>&1
            fi
          REMOTE

      - name: Publish to job summary
        run: |
          {
            echo "## API container logs"
            echo ''
            echo '```'
            cat raw-logs.txt | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
