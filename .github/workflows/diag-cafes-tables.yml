name: Diag Cafes Tables

# Manual diagnostic — production reports 'column daily_game_limit does
# not exist' on cafes table even though our normal schema dump confirms
# the column exists. Most likely cause: there's a second `cafes` table
# in a different schema or a view shadowing it. This workflow lists
# EVERY relation named cafes across every schema + the api connection's
# search_path so we can spot the shadow.

on:
  workflow_dispatch: {}

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect cafes tables across schemas
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE'
            set +e
            cd "$DEPLOY_PATH"
            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose "$@"; }
            else
              compose() { docker-compose "$@"; }
            fi

            DB_USER=$(grep -E '^DB_USER=' .env | cut -d= -f2)
            DB_NAME=$(grep -E '^DB_NAME=' .env | cut -d= -f2)
            DB_PASSWORD=$(grep -E '^DB_PASSWORD=' .env | cut -d= -f2)

            cat <<'SQL' > /tmp/cafes.sql
            \echo === ALL cafes-like relations across ALL schemas ===
            SELECT table_schema, table_name, table_type
              FROM information_schema.tables
              WHERE table_name LIKE '%cafe%'
              ORDER BY table_schema, table_name;
            \echo
            \echo === Columns in public.cafes ===
            SELECT column_name, data_type
              FROM information_schema.columns
              WHERE table_schema='public' AND table_name='cafes'
              ORDER BY ordinal_position;
            \echo
            \echo === current_user + search_path + current_schema ===
            SELECT current_user, current_schema(), current_setting('search_path');
            \echo
            \echo === pg_catalog.pg_class entries for cafes (all schemas) ===
            SELECT n.nspname AS schema, c.relname AS name, c.relkind AS kind, pg_get_userbyid(c.relowner) AS owner
              FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE c.relname='cafes' OR c.relname='games' OR c.relname='cafes_view';
            \echo
            \echo === As app DB_USER: same query that fails in API ===
SQL

            echo "=== AS POSTGRES SUPERUSER ==="
            compose -f deploy/docker-compose.prod.yml --env-file .env exec -T \
              -e PGPASSWORD="$DB_PASSWORD" postgres psql -U "$DB_USER" -d "$DB_NAME" < /tmp/cafes.sql
            echo ""
            echo "=== AS API VIA DATABASE_URL ==="
            compose -f deploy/docker-compose.prod.yml --env-file .env exec -T api sh -lc '
              node -e "
                const { Pool } = require(\"pg\");
                const pool = new Pool({ connectionString: process.env.DATABASE_URL });
                (async () => {
                  try {
                    const u = await pool.query(\"SELECT current_user, current_schema(), current_setting(\\\"search_path\\\")\");
                    console.log(\"who:\", JSON.stringify(u.rows[0]));
                    const t = await pool.query(\"SELECT table_schema, table_name FROM information_schema.tables WHERE table_name LIKE \\\"%cafe%\\\" ORDER BY 1,2\");
                    console.log(\"cafe-tables:\", JSON.stringify(t.rows));
                    const c = await pool.query(\"SELECT column_name FROM information_schema.columns WHERE table_name=\\\"cafes\\\" AND column_name LIKE \\\"daily%\\\"\");
                    console.log(\"daily-cols:\", JSON.stringify(c.rows));
                    const r = await pool.query(\"SELECT daily_game_limit FROM cafes WHERE id = 1\");
                    console.log(\"query-ok:\", JSON.stringify(r.rows));
                  } catch (err) {
                    console.log(\"query-FAIL:\", err.code, err.message);
                  } finally {
                    await pool.end();
                  }
                })();
              "
            '
          REMOTE
