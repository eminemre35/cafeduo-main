name: Diag DB Schema

# Manual diagnostic — runs psql inside the api container to dump the
# current schema for the tables that the wheel endpoint touches.
# Triggered from the Actions tab when we suspect a migration didn't
# fully apply or a column is missing.

on:
  workflow_dispatch: {}

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Dump cafes + user_daily_spins schema
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE' > schema.txt 2>&1
            set -euo pipefail
            cd "$DEPLOY_PATH"
            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose "$@"; }
            else
              compose() { docker-compose "$@"; }
            fi

            # Run schema queries inside the postgres container directly.
            # `--env-file .env` so DB_URL is available if the compose file
            # needs it.
            cat <<'SQL' > /tmp/diag.sql
            \echo === cafes columns ===
            SELECT column_name, data_type, is_nullable
              FROM information_schema.columns
              WHERE table_schema = current_schema() AND table_name = 'cafes'
              ORDER BY ordinal_position;
            \echo
            \echo === user_daily_spins columns ===
            SELECT column_name, data_type, is_nullable
              FROM information_schema.columns
              WHERE table_schema = current_schema() AND table_name = 'user_daily_spins'
              ORDER BY ordinal_position;
            \echo
            \echo === user_items columns (looking for cafe_id) ===
            SELECT column_name, data_type
              FROM information_schema.columns
              WHERE table_schema = current_schema() AND table_name = 'user_items'
              ORDER BY ordinal_position;
            \echo
            \echo === games columns (looking for cafe_id) ===
            SELECT column_name, data_type
              FROM information_schema.columns
              WHERE table_schema = current_schema() AND table_name = 'games'
              ORDER BY ordinal_position;
            \echo
            \echo === pgmigrations applied ===
            SELECT name, run_on FROM pgmigrations ORDER BY name;
            \echo
            \echo === cafes row count + name list ===
            SELECT id, name, daily_game_limit FROM cafes ORDER BY id;
          SQL

            compose -f deploy/docker-compose.prod.yml --env-file .env exec -T -e PGPASSWORD="$(grep -E '^DB_PASSWORD=' .env | cut -d= -f2)" postgres psql -U "$(grep -E '^DB_USER=' .env | cut -d= -f2)" -d "$(grep -E '^DB_NAME=' .env | cut -d= -f2)" < /tmp/diag.sql 2>&1 || compose -f deploy/docker-compose.prod.yml --env-file .env exec -T postgres psql -U cafeduo -d cafeduo < /tmp/diag.sql 2>&1
          REMOTE

      - name: Echo schema
        run: |
          echo "=== BEGIN schema.txt ==="
          cat schema.txt
          echo "=== END schema.txt ==="
