name: Diag Wheel Call

# Manual diagnostic — SSHs into the VPS and calls /api/wheel/X from
# inside the box (talking to the api container directly via the public
# nginx on localhost). This avoids the Cloudflare/GH-Actions DNS mismatch
# that made the previous "log in from runner" version land on a wrong
# upstream and 404. Dumps full response (status + body + any pg error
# details surfaced by EXPOSE_API_ERRORS=true).

on:
  workflow_dispatch:
    inputs:
      cafeId:
        description: Cafe ID to query (default 1 — PAÜ İİBF Kantin)
        required: false
        default: '1'

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Login + call /api/wheel via VPS-local curl
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_LOGIN_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_LOGIN_PASSWORD }}
          CAFE_ID: ${{ inputs.cafeId }}
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' SMOKE_EMAIL='${SMOKE_EMAIL}' SMOKE_PASSWORD='${SMOKE_PASSWORD}' CAFE_ID='${CAFE_ID}' bash -s" <<'REMOTE'
            set +e
            cd "$DEPLOY_PATH"

            # docker compose vs docker-compose detection (same as deploy)
            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose "$@"; }
            else
              compose() { docker-compose "$@"; }
            fi

            # We curl from INSIDE the api container — that bypasses the host
            # nginx / Cloudflare / whatever else might sit in front. The api
            # process listens on :3001 directly so the call is unambiguous.
            CTR_EXEC="compose -f deploy/docker-compose.prod.yml --env-file .env exec -T api"
            BASE="http://127.0.0.1:3001"
            COOKIES=/tmp/diag-wheel-cookies.txt

            # Install curl in the container if missing (Alpine-based images
            # often don't ship it). Quiet failure is fine; the next curl
            # call will surface the real error.
            $CTR_EXEC sh -lc 'command -v curl >/dev/null || (apk add --no-cache curl 2>/dev/null || apt-get update -qq && apt-get install -y -qq curl) >/dev/null 2>&1; rm -f /tmp/diag-wheel-cookies.txt' || true

            echo "=== Probe ${BASE}/api/health ==="
            $CTR_EXEC sh -lc "curl -sS -i --max-time 6 '${BASE}/api/health'" | head -20
            echo ""

            echo "=== POST ${BASE}/api/auth/login ==="
            $CTR_EXEC sh -lc "curl -sS -i -c ${COOKIES} --max-time 10 \
              -H 'Content-Type: application/json' \
              -d '{\"email\":\"${SMOKE_EMAIL}\",\"password\":\"${SMOKE_PASSWORD}\"}' \
              '${BASE}/api/auth/login'" | head -40
            echo ""

            echo "=== Cookie jar ==="
            $CTR_EXEC sh -lc "cat ${COOKIES} 2>/dev/null || echo '<no cookies>'"
            echo ""

            echo "=== GET ${BASE}/api/wheel/${CAFE_ID} ==="
            $CTR_EXEC sh -lc "CSRF=\$(awk '\$6 == \"csrf_token\" {print \$7}' ${COOKIES} 2>/dev/null | tail -1); \
              curl -sS -i -b ${COOKIES} --max-time 10 \
                -H \"X-CSRF-Token: \${CSRF:-x}\" \
                '${BASE}/api/wheel/${CAFE_ID}'" | head -80
            echo ""
            echo "=== End ==="
          REMOTE
