name: Diag Wheel Call

# Manual diagnostic — SSHs into the VPS and calls /api/wheel/X from
# inside the box (talking to the api container directly via the public
# nginx on localhost). This avoids the Cloudflare/GH-Actions DNS mismatch
# that made the previous "log in from runner" version land on a wrong
# upstream and 404. Dumps full response (status + body + any pg error
# details surfaced by EXPOSE_API_ERRORS=true).

on:
  workflow_dispatch:
    inputs:
      cafeId:
        description: Cafe ID to query (default 1 — PAÜ İİBF Kantin)
        required: false
        default: '1'

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Login + call /api/wheel via VPS-local curl
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_LOGIN_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_LOGIN_PASSWORD }}
          CAFE_ID: ${{ inputs.cafeId }}
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "SMOKE_EMAIL='${SMOKE_EMAIL}' SMOKE_PASSWORD='${SMOKE_PASSWORD}' CAFE_ID='${CAFE_ID}' bash -s" <<'REMOTE'
            set +e
            # Pick base URL: prefer 127.0.0.1 (works whether nginx is the
            # public-port reverse proxy or the api container is mapped to
            # 3001). Fall back to the public domain on failure.
            BASE="http://127.0.0.1"
            COOKIES=/tmp/diag-wheel-cookies.txt
            rm -f "$COOKIES"

            echo "=== Probe ${BASE}/api/health ==="
            curl -sS -i --max-time 6 "$BASE/api/health" | head -20
            echo ""

            echo "=== POST ${BASE}/api/auth/login ==="
            LOGIN_RES=$(curl -sS -i -c "$COOKIES" --max-time 10 \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\"}" \
              "$BASE/api/auth/login")
            echo "$LOGIN_RES" | head -30
            echo ""

            # CSRF + JWT are both in cookies after a successful login. Read
            # cookies.txt: each line is "host TRUE / FALSE expiry name value".
            CSRF=""
            if [ -f "$COOKIES" ]; then
              CSRF=$(awk '$6 == "csrf_token" {print $7}' "$COOKIES" | tail -1)
            fi
            echo "csrf_token=${CSRF:-<missing>}"
            echo ""

            echo "=== GET ${BASE}/api/wheel/$CAFE_ID ==="
            curl -sS -i -b "$COOKIES" --max-time 10 \
              -H "X-CSRF-Token: ${CSRF:-x}" \
              "$BASE/api/wheel/$CAFE_ID" | head -60
            echo ""
            echo "=== End ==="
          REMOTE
